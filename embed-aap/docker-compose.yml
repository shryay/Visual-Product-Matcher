version: '3.8'

services:
  flask-api:
    build: .
    ports:
      - "8081:8081"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - SUPABASE_BUCKET=${SUPABASE_BUCKET}
      - PORT=8081
      - FEATURE_VECTOR_DIM=1280
      - MAX_CONTENT_LENGTH=10485760
    restart: unless-stopped
